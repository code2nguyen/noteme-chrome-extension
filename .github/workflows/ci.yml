name: CI

on:
  pull_request:
  push:
    branches: [master]
  # The release workflow runs the same checks before it publishes.
  workflow_call:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # the changelog is built from the whole history
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run type-check
      - run: npm test
      - name: CHANGELOG.md is up to date
        run: npm run --silent changelog -- --check
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      # Chromium only, against the production build: the web page and the unpacked extension.
      - run: npx playwright test
      - name: Package the extension
        id: package
        run: echo "zip=$(npm run --silent package)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v6
        with:
          name: extension
          path: ${{ steps.package.outputs.zip }}
          if-no-files-found: error
      - uses: actions/upload-artifact@v6
        if: failure()
        with:
          name: test-results
          path: test-results/
          retention-days: 7
