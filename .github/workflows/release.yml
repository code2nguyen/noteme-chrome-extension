name: Release a new version

# Run workflow in the Actions tab, on master: the checks, then `npm version <bump>` (package.json, src/manifest.json
# and CHANGELOG.md, committed as "<version>" and tagged v<version>), pushed to master, and a GitHub release with the
# zip and that version's notes. Nothing reaches the store: "Publish to the Chrome Web Store" sends a release there.
on:
  workflow_dispatch:
    inputs:
      bump:
        description: Which part of the version to raise
        type: choice
        default: patch
        options:
          - patch # 3.0.0 → 3.0.1: fixes
          - minor # 3.0.0 → 3.1.0: new features
          - major # 3.0.0 → 4.0.0: breaking changes

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  check:
    if: ${{ github.ref == 'refs/heads/master' }}
    uses: ./.github/workflows/ci.yml

  release:
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write # the version commit, its tag and the GitHub release
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # the changelog is built from the whole history
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
        env:
          HUSKY: '0' # no pre-commit hook on the version commit

      # The version script syncs src/manifest.json and files the commits since the last release in CHANGELOG.md.
      - name: Bump the version
        id: bump
        env:
          BUMP: ${{ inputs.bump }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          npm version "$BUMP" --message '%s'
          version=$(node -p "require('./package.json').version")
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Package
        run: npm run build && npm run package

      - name: Release notes
        env:
          VERSION: ${{ steps.bump.outputs.version }}
        run: |
          node scripts/changelog.ts --notes "$VERSION" > dist/notes.md
          { echo "## Noteme $VERSION"; echo; cat dist/notes.md; } >> "$GITHUB_STEP_SUMMARY"

      # Atomic: the commit and the tag land together, or neither does when master moved since the run started.
      - name: Push
        env:
          VERSION: ${{ steps.bump.outputs.version }}
        run: git push --atomic origin HEAD:master "v$VERSION"

      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.bump.outputs.version }}
        run: |
          gh release create "v$VERSION" "dist/noteme-$VERSION.zip" --title "Noteme $VERSION" \
            --notes-file dist/notes.md --verify-tag --latest
