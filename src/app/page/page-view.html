<header class="page-bar">
  <a class="page-bar__back" routerLink="/main-board" [queryParams]="inArchive() ? { view: 'archive' } : {}">
    <c2-feather-arrow-left aria-hidden="true"></c2-feather-arrow-left>
    {{ inArchive() ? 'Archive' : 'Notes' }}
  </a>
  <span class="page-bar__status" role="status">{{ status() }}</span>
  <span class="page-bar__spacer"></span>
  <c2-menu placement="bottom-end" aria-label="Page actions" (menu-select)="onMenu($event)">
    <c2-icon-button slot="trigger" aria-label="Page actions" tooltip="More">
      <c2-feather-more-horizontal></c2-feather-more-horizontal>
    </c2-icon-button>
    @if (inArchive()) {
      <c2-menu-item value="restore">
        <c2-feather-rotate-ccw slot="prefix-icon"></c2-feather-rotate-ccw>
        Restore to the board
      </c2-menu-item>
    } @else {
      <c2-menu-item value="archive">
        <c2-feather-archive slot="prefix-icon"></c2-feather-archive>
        Archive
      </c2-menu-item>
    }
    <c2-menu-item value="delete" destructive>
      <c2-feather-trash-2 slot="prefix-icon"></c2-feather-trash-2>
      Delete this page
    </c2-menu-item>
  </c2-menu>
</header>

@if (found() === false) {
  <main class="page page--missing">
    <p>This page no longer exists.</p>
    <a routerLink="/main-board">Back to your notes</a>
  </main>
} @else if (found()) {
  <main class="page">
    <c2-page-editor
      #editor
      class="page__editor"
      label="Page"
      placeholder="Write something, or press / for headings, lists, code…"
      [value]="value()"
      (input)="onEditorInput($event)"
    >
      <div slot="header" class="page__header">
        <!-- Read as the page's heading; a click (or Enter on it) turns it into a field, saved on Enter or on leaving it. -->
        <c2-inline-edit
          #titleField
          class="page__title"
          label="Title"
          placeholder="Untitled"
          [value]="title()"
          (input)="$event.stopPropagation()"
          (change)="onTitleChange($event)"
        ></c2-inline-edit>
        @if (created()) {
          <p class="page__meta">Page · {{ created() }}</p>
        }
      </div>
    </c2-page-editor>
  </main>
} @else {
  <!-- Nothing to edit until the stored page is read: text typed into an empty editor would be overwritten by it. -->
  <main class="page" aria-busy="true"></main>
}
