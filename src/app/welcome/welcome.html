<button type="button" class="welcome" (click)="open()" aria-label="Open my notes">
  <!-- dogfood-exempt: full-page click target, no c2 equivalent -->
  <time class="welcome__time" [attr.datetime]="time()">{{ time() }}</time>
  <span class="welcome__date">{{ date() }}</span>
  <span class="welcome__hint">Click anywhere to open your notes</span>
</button>
