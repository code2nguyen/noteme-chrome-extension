<div class="note__body">
  <c2-notepad
    class="note__text"
    aria-label="Note"
    placeholder="New note..."
    paper-picker
    [attr.pad]="pad()"
    [attr.paper]="paper()"
    [attr.paper-color]="paperColor()"
    [value]="value()"
    (input)="onTextInput($event)"
    (paper-change)="onPaperChange($event)"
  >
    <c2-menu
      slot="actions"
      class="note__actions"
      placement="bottom-end"
      aria-label="Note actions"
      (menu-select)="onMenu($event)"
    >
      <c2-icon-button slot="trigger" aria-label="Note actions" tooltip="More">
        <c2-feather-more-horizontal></c2-feather-more-horizontal>
      </c2-icon-button>
      @if (archived()) {
        <c2-menu-item value="restore">
          <c2-feather-rotate-ccw slot="prefix-icon"></c2-feather-rotate-ccw>
          Restore to the board
        </c2-menu-item>
      } @else {
        <c2-menu-item value="archive">
          <c2-feather-archive slot="prefix-icon"></c2-feather-archive>
          Archive
        </c2-menu-item>
      }
      <c2-menu-item value="delete" destructive>
        <c2-feather-trash-2 slot="prefix-icon"></c2-feather-trash-2>
        Delete this note
      </c2-menu-item>
    </c2-menu>
  </c2-notepad>
</div>
