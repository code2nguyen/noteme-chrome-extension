<div class="note__body" [class.note__body--tearing]="tearing()">
  <c2-notepad
    class="note__text"
    aria-label="Note"
    placeholder="New note..."
    paper-picker
    actions-placement="end"
    tearable
    [attr.pad]="pad()"
    [attr.paper]="paper()"
    [attr.paper-color]="paperColor()"
    [style.--c2-notepad__sheet--rotate]="tilt()"
    [value]="value()"
    (input)="onTextInput($event)"
    (change)="onTextInput($event)"
    (paper-change)="onPaperChange($event)"
    (page-tear)="onPageTear($event)"
  >
    @if (pinned()) {
      <c2-icon-button
        slot="actions"
        class="note__actions note__unpin"
        aria-label="Unpin from the board"
        tooltip="Unpin from the board"
        (click)="unpin.emit()"
      >
        <c2-phosphor-push-pin weight="fill"></c2-phosphor-push-pin>
      </c2-icon-button>
    }
    <!-- Moves the note's tile: its c2-masonry-item names this button in move-handle. -->
    <c2-icon-button
      slot="actions"
      class="note__actions note__move"
      [id]="'move-' + item().id"
      aria-label="Move note"
      tooltip="Move"
    >
      <c2-feather-move></c2-feather-move>
    </c2-icon-button>
    <c2-menu
      slot="actions"
      class="note__actions"
      placement="bottom-end"
      aria-label="Note actions"
      (menu-select)="onMenu($event)"
    >
      <c2-icon-button slot="trigger" aria-label="Note actions" tooltip="More">
        <c2-feather-more-vertical></c2-feather-more-vertical>
      </c2-icon-button>
      @if (pinned()) {
        <c2-menu-item value="unpin">
          <c2-phosphor-push-pin-slash slot="prefix-icon"></c2-phosphor-push-pin-slash>
          Unpin from the board
        </c2-menu-item>
      } @else {
        <c2-menu-item value="pin">
          <c2-phosphor-push-pin slot="prefix-icon"></c2-phosphor-push-pin>
          Pin to the board
        </c2-menu-item>
      }
      <c2-menu-item value="archive">
        <c2-feather-archive slot="prefix-icon"></c2-feather-archive>
        Archive
      </c2-menu-item>
      <c2-menu-item value="delete" destructive>
        <c2-feather-trash-2 slot="prefix-icon"></c2-feather-trash-2>
        Delete this note
      </c2-menu-item>
    </c2-menu>
  </c2-notepad>
</div>
@if (blinking()) {
  <!-- Picked from the search: a light runs twice around the note, then fades (note-card.scss). -->
  <span class="note__beam">
    <c2-border-beam class="note__beam-light"></c2-border-beam>
  </span>
}
