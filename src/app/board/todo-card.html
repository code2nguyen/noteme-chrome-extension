<div class="todo__body">
  <c2-todo-list
    #list
    class="todo__list"
    customizable
    heading-editable
    [attr.heading-placeholder]="t('common.untitled.list')"
    actions-placement="end"
    progress="ring"
    [attr.placeholder]="t('board.list.placeholder')"
    [heading]="title()"
    [tasks]="tasks()"
    [look]="look()"
    (tasks-change)="onTasksChange($event)"
    (look-change)="onLookChange($event)"
    (heading-change)="onHeadingChange($event)"
  >
    <!-- Moves the list's tile: its c2-masonry-item names this button in move-handle. -->
    <c2-icon-button
      slot="actions"
      class="todo__actions todo__move"
      [id]="'move-' + item().id"
      [attr.aria-label]="t('board.list.move')"
      [tooltip]="t('board.move')"
    >
      <c2-feather-move></c2-feather-move>
    </c2-icon-button>
    <c2-menu
      slot="actions"
      class="todo__actions"
      placement="bottom-end"
      [attr.aria-label]="t('board.list.actions')"
      (menu-select)="onMenu($event)"
    >
      <c2-icon-button slot="trigger" [attr.aria-label]="t('board.list.actions')" [tooltip]="t('board.more')">
        <c2-feather-more-vertical></c2-feather-more-vertical>
      </c2-icon-button>
      <c2-menu-item value="rename">
        <c2-feather-edit-2 slot="prefix-icon"></c2-feather-edit-2>
        {{ t('board.rename') }}
      </c2-menu-item>
      @if (pinned()) {
        <c2-menu-item value="unpin">
          <c2-phosphor-push-pin-slash slot="prefix-icon"></c2-phosphor-push-pin-slash>
          {{ t('board.unpin') }}
        </c2-menu-item>
      } @else {
        <c2-menu-item value="pin">
          <c2-phosphor-push-pin slot="prefix-icon"></c2-phosphor-push-pin>
          {{ t('board.pin') }}
        </c2-menu-item>
      }
      <c2-menu-item value="archive">
        <c2-feather-archive slot="prefix-icon"></c2-feather-archive>
        {{ t('board.toArchive') }}
      </c2-menu-item>
      <c2-menu-item value="delete" destructive>
        <c2-feather-trash-2 slot="prefix-icon"></c2-feather-trash-2>
        {{ t('board.list.delete') }}
      </c2-menu-item>
    </c2-menu>
  </c2-todo-list>
</div>
@if (blinking()) {
  <!-- Picked from the search: a light runs twice around the list, then fades (as on a note). -->
  <span class="todo__beam">
    <c2-border-beam class="todo__beam-light"></c2-border-beam>
  </span>
}
